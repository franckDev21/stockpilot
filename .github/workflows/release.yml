name: Build & Release Windows

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      # Sans ce secret, l'app se construit tres bien mais reclame des
      # identifiants a l'utilisateur au lieu d'envoyer en deux clics. Une
      # release amputee de son jeton est indiscernable d'une release saine
      # tant que personne n'a clique : on refuse de la publier.
      - name: Verifier la presence du jeton d'envoi
        shell: bash
        run: |
          if [ -z "${STOCKPILOT_UPLOAD_TOKEN}" ]; then
            echo "::error::secret STOCKPILOT_UPLOAD_TOKEN absent — le bouton « Envoyer au serveur » redemanderait un mot de passe."
            exit 1
          fi
          echo "Jeton d'envoi present (${#STOCKPILOT_UPLOAD_TOKEN} caracteres)."
        env:
          STOCKPILOT_UPLOAD_TOKEN: ${{ secrets.STOCKPILOT_UPLOAD_TOKEN }}

      - run: npm run release:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Jeton du bouton « Envoyer au serveur ». Il ne peut pas vivre dans le
          # depot, qui est public — condition de l'auto-update. Sans ce secret,
          # l'app construite redemande des identifiants au lieu d'envoyer en
          # deux clics : le bouton fonctionne toujours, mais moins vite.
          STOCKPILOT_UPLOAD_TOKEN: ${{ secrets.STOCKPILOT_UPLOAD_TOKEN }}
